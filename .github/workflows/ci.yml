name: CI

on:
  pull_request:
    branches: [dev, main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [dev, main]
  workflow_call:
    inputs:
      revision:
        type: string
        required: true
      release-tag:
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.revision || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  policy:
    name: PR policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      desktop: ${{ steps.policy.outputs.desktop }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        id: policy
        with:
          script: |
            const { issueNumbers } = require('./.github/scripts/policy.cjs');
            const pr = context.payload.pull_request;
            if (!pr) {
              core.setOutput('desktop', 'true');
              return;
            }
            for (const issue_number of issueNumbers(pr, `${context.repo.owner}/${context.repo.repo}`)) {
              const { data } = await github.rest.issues.get({ ...context.repo, issue_number });
              if (data.pull_request) throw new Error(`#${issue_number} is a PR, not an issue`);
            }
            const files = await github.paginate(github.rest.pulls.listFiles, {
              ...context.repo, pull_number: pr.number, per_page: 100
            });
            // Backend and frontend changes can affect desktop behavior too.
            const desktop = pr.base.ref === 'main' || files.some(({ filename }) =>
              /^(backend\/|frontend\/|\.github\/)/.test(filename));
            core.setOutput('desktop', String(desktop));
  validation:
    name: Workflow validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: node --test .github/scripts/policy.test.cjs
      - run: python .github/scripts/install-tool.py actionlint "$RUNNER_TEMP/tools"
      - run: '"$RUNNER_TEMP/tools/actionlint" -color'
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install --require-hashes -r backend/requirements-dev.txt
      - run: python -m pytest backend/tests -q
        env:
          EBON_DB_PATH: ${{ runner.temp }}/test.db
          EBON_UPLOAD_DIR: ${{ runner.temp }}/uploads
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: node --test tests/errors.test.mjs
      - run: npm run check
      - run: npm run lint
      - run: npm run build
  security:
    uses: ./.github/workflows/security.yml
    with:
      revision: ${{ inputs.revision || github.sha }}
  desktop:
    name: Desktop (${{ matrix.label }})
    needs: policy
    if: needs.policy.outputs.desktop == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            label: windows
            bundle: nsis
          - runner: macos-latest
            label: macos-arm64
            bundle: dmg
          # macOS Intel is deferred by maintainer request; restore after #13.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - run: python -m pip install --require-hashes -r backend/requirements-dev.txt
      - run: npm ci
        working-directory: frontend
      - name: Apply release version in build workspace
        if: inputs.release-tag != ''
        run: python .github/scripts/release-version.py
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
      - run: npm run tauri:build -- --bundles ${{ matrix.bundle }}
        working-directory: frontend
      - run: python .github/scripts/smoke-sidecar.py
      - run: python .github/scripts/collect-artifacts.py
        env:
          ARTIFACT_LABEL: ${{ matrix.label }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-${{ matrix.label }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
  gate:
    name: CI / gate
    if: always()
    needs: [policy, validation, backend, frontend, security, desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - run: node .github/scripts/gate.cjs
        env:
          RESULTS: ${{ toJSON(needs) }}
          DESKTOP: ${{ needs.policy.outputs.desktop }}
