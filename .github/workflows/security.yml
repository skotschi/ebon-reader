name: Security

on:
  schedule:
    - cron: '23 7 * * 1'
  workflow_dispatch:
  workflow_call:
    inputs:
      revision:
        required: true
        type: string

permissions:
  contents: read

jobs:
  audit:
    name: Dependency and secret scans
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.revision || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install pip-audit
      - name: Python audit
        run: pip-audit --require-hashes -r backend/requirements-dev.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: success() || failure()
        with:
          node-version: '24'
      - name: npm audit including build tools
        if: success() || failure()
        working-directory: frontend
        run: npm audit --include=dev --audit-level=high
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        if: success() || failure()
      - run: cargo install cargo-audit --locked
        if: success() || failure()
      - name: Rust audit
        if: success() || failure()
        working-directory: frontend/src-tauri
        run: cargo audit
      - name: Install secret scanner
        if: success() || failure()
        run: python .github/scripts/install-tool.py gitleaks "$RUNNER_TEMP/tools"
      - name: Scan Git history for secrets
        if: success() || failure()
        run: '"$RUNNER_TEMP/tools/gitleaks" git --redact --no-banner .'
