name: Release Build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed version tag on main
        required: true
        type: string
      publish:
        description: Publish a GitHub release after validation (requires explicit authorization)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.verify.outputs.tag }}
      sha: ${{ steps.verify.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release target
        id: verify
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]
          if [[ "$PUBLISH" == true && "$GITHUB_REF" != refs/heads/main ]]; then
            echo 'Publishing must be dispatched from main.' >&2
            exit 1
          fi
          SHA=$(git rev-parse --verify "refs/tags/$TAG^{commit}")
          git merge-base --is-ancestor "$SHA" origin/main
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
  validate:
    needs: verify
    permissions:
      contents: read
      issues: read
      pull-requests: read
    uses: ./.github/workflows/ci.yml
    with:
      revision: ${{ needs.verify.outputs.sha }}
      release-tag: ${{ needs.verify.outputs.tag }}
  publish:
    if: inputs.publish
    needs: [verify, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # No checkout or execution of repository code in this write-enabled job.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: desktop-macos-arm64
          path: dist
      - name: Publish validated artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.verify.outputs.tag }}
          EXPECTED_SHA: ${{ needs.verify.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          # Resolve the tag again to reject movement during validation.
          SHA=$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha)
          [[ "$SHA" == "$EXPECTED_SHA" ]]
          cd dist
          # Fail closed if the artifact contains anything but one ARM64 DMG
          # and its single-entry checksum manifest (including hidden files).
          shopt -s nullglob dotglob
          files=(*)
          installers=(*_aarch64.dmg)
          [[ ${#files[@]} == 2 ]] || exit 1
          [[ ${#installers[@]} == 1 ]] || exit 1
          [[ -f "${installers[0]}" && ! -L "${installers[0]}" ]]
          [[ -f SHA256SUMS-macos-arm64.txt && ! -L SHA256SUMS-macos-arm64.txt ]]
          [[ $(wc -l < SHA256SUMS-macos-arm64.txt) == 1 ]]
          sha256sum -- "${installers[0]}" > "$RUNNER_TEMP/expected-checksums.txt"
          cmp SHA256SUMS-macos-arm64.txt "$RUNNER_TEMP/expected-checksums.txt"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to replace it.' >&2
            exit 1
          fi
          gh release create "$TAG" --verify-tag --generate-notes --draft "${installers[0]}" SHA256SUMS-macos-arm64.txt
          gh release edit "$TAG" --draft=false
