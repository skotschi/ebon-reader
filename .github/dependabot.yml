version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [maintenance]
    groups:
      compatible:
        update-types: [minor, patch]
  - package-ecosystem: pip
    directory: /backend
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [maintenance]
    groups:
      compatible:
        update-types: [minor, patch]
  - package-ecosystem: cargo
    directory: /frontend/src-tauri
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [maintenance]
    groups:
      compatible:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [maintenance]
